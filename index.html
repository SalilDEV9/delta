<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Constellation</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            font-family: 'Lora', serif; overflow: hidden; background-color: #0a0a0a;
        }

        /* External High-Res Tree Background */
        #tree-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover no-repeat;
            transition: filter 3s ease; filter: brightness(0.6);
        }

        /* Image-Filled Nodes */
        .node {
            position: absolute; width: 65px; height: 65px;
            background-size: cover; background-position: center;
            border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
            cursor: pointer; transform: translate(-50%, -50%);
            transition: all 0.4s ease; z-index: 10;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 30px #fff, 0 0 50px #ffeb3b; z-index: 12; }
        
        /* Dashboard Placements & External Thumbnail Images */
        #node-1 { bottom: 15%; left: 25%; background-image: url('https://images.unsplash.com/photo-1474403078171-841808b8b8ba?w=200'); }
        #node-2 { bottom: 30%; left: 70%; background-image: url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=200'); }
        #node-3 { bottom: 45%; left: 35%; background-image: url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=200'); }
        #node-4 { bottom: 60%; left: 65%; background-image: url('https://images.unsplash.com/photo-1490750967868-88cb4aca8fbf?w=200'); }
        #node-5 { bottom: 75%; left: 30%; background-image: url('https://images.unsplash.com/photo-1462275646964-a0e3386b89fa?w=200'); }
        #node-6 { bottom: 80%; left: 75%; background-image: url('https://images.unsplash.com/photo-1507504031008-b5d7d8e8b0c7?w=200'); }
        
        /* The Finale Cake Node */
        #node-cake {
            position: absolute; top: 10%; left: 50%;
            font-size: 4rem; cursor: pointer; display: none;
            transform: translate(-50%, -50%); z-index: 15;
            text-shadow: 0 0 25px #ff4081; animation: float 3s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { top: 10%; } 50% { top: 8%; } }

        /* Frosted Glass Memory Panel */
        #memory-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            width: 80vw; max-width: 600px; padding: 40px; text-align: center;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px;
            color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            opacity: 0; pointer-events: none; transition: all 0.5s ease; z-index: 20;
        }
        #memory-panel.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        #memory-panel p { font-size: 1.4rem; line-height: 1.8; text-shadow: 1px 1px 6px rgba(0,0,0,0.9); }
        .close-btn { margin-top: 20px; padding: 10px 30px; background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid #fff; border-radius: 30px; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { background: #fff; color: #000; }

        /* Spring Petals Engine */
        .petal { position: absolute; background: #ffb7b2; border-radius: 150% 0 150% 0; opacity: 0.7; pointer-events: none; animation: fall linear infinite; z-index: 5; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        /* Gateway Overlay */
        #gateway { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; transition: opacity 1.5s; }
        .gateway-btn { padding: 15px 40px; font-size: 1.2rem; background: transparent; color: #fff; border: 2px solid #ff4081; border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px #ff4081; transition: 0.3s; font-family: 'Playfair Display', serif; }
        .gateway-btn:hover { background: #ff4081; }
    </style>
</head>
<body>

    <audio id="audio-bg" loop><source src="https://archive.org/download/aachalketujhe/Aa%20Chal%20Ke%20Tujhe.mp3" type="audio/mpeg"></audio>
    <audio id="audio-bday" loop><source src="https://archive.org/download/HappyBirthdayToYou_201708/Happy%20Birthday%20To%20You.mp3" type="audio/mpeg"></audio>

    <div id="gateway">
        <button class="gateway-btn" onclick="initializeSystem()">Enter Constellation</button>
    </div>

    <div id="tree-canvas">
        <div class="node" id="node-1" onclick="openMemory(1)"></div>
        <div class="node" id="node-2" onclick="openMemory(2)"></div>
        <div class="node" id="node-3" onclick="openMemory(3)"></div>
        <div class="node" id="node-4" onclick="openMemory(4)"></div>
        <div class="node" id="node-5" onclick="openMemory(5)"></div>
        <div class="node" id="node-6" onclick="openMemory(6)"></div>
        <div id="node-cake" onclick="triggerFinale()">🎂</div>
    </div>

    <div id="memory-panel">
        <p id="memory-text"></p>
        <button class="close-btn" onclick="closeMemory()">Continue</button>
    </div>

    <script>
        const API_BASE = "https://neeharika-vault.saliljha523.workers.dev";
        let finaleUnlocked = false;
        
        // Hardcoded story for immediate visual loading
        const storyData = {
            1: "In the golden haze of a September morning, I was traveling, wandering through streets I barely knew, when I met her—Neeharika.",
            2: "But even in those first two days, I sensed something different about her. She didn’t just speak—she listened.",
            3: "Her joy is effortless. I remember a small moment: a stray paper caught in the wind. 'It’s dancing,' she said.",
            4: "Her favorite season is spring, and it suits her perfectly. There’s a rhythm to her presence, a cadence that mirrors renewal itself.",
            5: "Because of personal reasons, I couldn’t always talk as much as I wanted. But I feel so comfortable and secure talking to you.",
            6: "People like her don’t merely enter your life—they illuminate it. And I carry her presence like sunlight."
        };

        async function initializeSystem() {
            document.getElementById('audio-bg').play();
            document.getElementById('gateway').style.opacity = '0';
            setTimeout(() => document.getElementById('gateway').style.display = 'none', 1500);

            // Fetch Time-Lock status from API
            try {
                const res = await fetch(`${API_BASE}/api/story`);
                const data = await res.json();
                if (data.finaleUnlocked) {
                    finaleUnlocked = true;
                    document.getElementById('node-cake').style.display = 'block';
                }
            } catch (e) { console.error("API Sync Failed"); }

            generatePetals();
        }

        function openMemory(id) {
            const panel = document.getElementById('memory-panel');
            document.getElementById('memory-text').innerHTML = storyData[id];

            const brightness = 0.6 + (id * 0.06);
            document.getElementById('tree-canvas').style.filter = `brightness(${brightness})`;

            panel.classList.add('active');
        }

        function closeMemory() {
            document.getElementById('memory-panel').classList.remove('active');
        }

        function triggerFinale() {
            document.getElementById('audio-bg').pause();
            document.getElementById('audio-bday').play();

            const panel = document.getElementById('memory-panel');
            document.getElementById('memory-text').innerHTML = `<strong style='font-size:2.2rem; color:#ff4081; font-family: "Playfair Display", serif;'>Happy Birthday, Neeharika. 🌸</strong><br><br>May this year be as vibrant, joyful, and full of possibilities as you are.`;
            panel.classList.add('active');

            launchFireworks();
        }

        function launchFireworks() {
            var duration = 15 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function generatePetals() {
            const container = document.getElementById('tree-canvas');
            for(let i=0; i<40; i++) {
                let p = document.createElement('div');
                p.className = 'petal';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = Math.random() * 12 + 6 + 'px';
                p.style.height = p.style.width;
                p.style.top = '-' + (Math.random() * 20 + 10) + 'px';
                p.style.animationDuration = Math.random() * 6 + 4 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(p);
            }
        }
    </script>
</body>
</html>
