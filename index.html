<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Constellation</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Playfair+Display:ital,wght@0,600;1,600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Lora', serif; overflow: hidden; background-color: #0a0a0a; color: #fff; }

        /* Garden Gateway with Timer */
        #gateway {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1558904541-efa843a96f0f?q=80&w=2000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: all 1s ease-out;
        }
        
        #doraemon-box {
            background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 30px; 
            text-align: center; color: #333; box-shadow: 0 20px 60px rgba(0,0,0,0.5); width: 85%; max-width: 500px;
        }

        #timer { font-family: 'Fira Code', monospace; font-size: 2.5rem; color: #d81b60; margin: 20px 0; font-weight: bold; }
        
        /* Main Tree Constellation */
        #tree-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover;
            display: none; filter: brightness(0.6); transition: filter 2s;
        }

        .node {
            position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff;
            background-size: cover; cursor: pointer; transform: translate(-50%, -50%); z-index: 10;
            box-shadow: 0 0 20px rgba(255,255,255,0.5); transition: 0.3s;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 40px #ffeb3b; }

        /* Coordinates */
        #node-1 { bottom: 20%; left: 30%; background-image: url('https://images.unsplash.com/photo-1474403078171-841808b8b8ba?w=200'); }
        #node-2 { bottom: 35%; left: 70%; background-image: url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=200'); }
        #node-3 { bottom: 50%; left: 25%; background-image: url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=200'); }
        #node-4 { bottom: 65%; left: 75%; background-image: url('https://images.unsplash.com/photo-1490750967868-88cb4aca8fbf?w=200'); }
        #node-cake { position: absolute; top: 15%; left: 50%; font-size: 4rem; cursor: pointer; display: none; transform: translate(-50%, -50%); animation: float 3s infinite; }

        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -60%) scale(1.1); } }

        /* Overlays */
        #memory-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 500px; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3);
            text-align: center; display: none; z-index: 200;
        }

        .petal { position: absolute; background: #ffb7b2; border-radius: 150% 0 150% 0; animation: fall linear infinite; pointer-events: none; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="audio-bg"><source src="https://archive.org/download/aachalketujhe/Aa%20Chal%20Ke%20Tujhe.mp3" type="audio/mpeg"></audio>
    <audio id="audio-bday"><source src="https://archive.org/download/HappyBirthdayToYou_201708/Happy%20Birthday%20To%20You.mp3" type="audio/mpeg"></audio>

    <div id="gateway">
        <div id="doraemon-box">
            <img src="https://upload.wikimedia.org/wikipedia/en/b/bd/Doraemon_character.png" width="120" alt="Doraemon">
            <h2 style="font-family: 'Playfair Display';">Neeharika, are you ready?</h2>
            <div id="timer">00:00:00</div>
            <p>The constellation awakens at midnight...</p>
        </div>
    </div>

    <div id="tree-canvas">
        <div class="node" id="node-1" onclick="showMemory(1)"></div>
        <div class="node" id="node-2" onclick="showMemory(2)"></div>
        <div class="node" id="node-3" onclick="showMemory(3)"></div>
        <div class="node" id="node-4" onclick="showMemory(4)"></div>
        <div id="node-cake" onclick="birthdayBoom()">🎂</div>
    </div>

    <div id="memory-panel" onclick="this.style.display='none'">
        <p id="memory-text" style="font-size: 1.3rem; line-height: 1.6;"></p>
        <p style="font-size: 0.8rem; color: #ccc;">(Click anywhere to close)</p>
    </div>

    <script>
        const memories = [
            "In the golden haze of a September morning, I met someone remarkable: You.",
            "You didn't just speak—you listened. You saw the silent battles and the tremors in voices.",
            "“Even chaos can have rhythm,” you said. You found beauty in a stray paper dancing in the wind.",
            "You are like Spring—fragile, persistent, and waiting to bloom. You illuminate everything."
        ];

        function updateTimer() {
            const now = new Date();
            const bday = new Date('2026-02-21T00:00:00+05:30');
            const diff = bday - now;

            if (diff <= 0) {
                document.getElementById('timer').innerText = "00:00:00";
                startTheBoom();
                return;
            }

            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            setTimeout(updateTimer, 1000);
        }

        function startTheBoom() {
            const gateway = document.getElementById('gateway');
            gateway.style.transform = "scale(2)";
            gateway.style.opacity = "0";
            
            setTimeout(() => {
                gateway.style.display = 'none';
                document.getElementById('tree-canvas').style.display = 'block';
                document.getElementById('audio-bg').play();
                // Check if cake should be visible
                document.getElementById('node-cake').style.display = 'block';
                generatePetals();
            }, 1000);
        }

        function showMemory(id) {
            const panel = document.getElementById('memory-panel');
            document.getElementById('memory-text').innerText = memories[id-1];
            panel.style.display = 'block';
            document.getElementById('tree-canvas').style.filter = `brightness(${0.6 + (id*0.1)})`;
        }

        function birthdayBoom() {
            document.getElementById('audio-bg').pause();
            document.getElementById('audio-bday').play();
            
            const panel = document.getElementById('memory-panel');
            document.getElementById('memory-text').innerHTML = "<span style='color:#ff4081; font-size:2rem;'>HAPPY BIRTHDAY NEEHARIKA! 🌸</span><br><br>You don't just enter lives—you illuminate them.";
            panel.style.display = 'block';

            var end = Date.now() + (15 * 1000);
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function generatePetals() {
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.className = 'petal';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = (Math.random() * 10 + 5) + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 5 + 5) + 's';
                document.body.appendChild(p);
            }
        }

        updateTimer();
    </script>
</body>
</html>
