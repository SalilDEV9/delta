<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Birthday Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4081; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; color: #fff; }

        /* Gateway Overlay */
        #gateway {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1558904541-efa843a96f0f?q=80&w=2000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; transition: 1.5s ease;
        }
        #auth-card {
            background: rgba(255, 255, 255, 0.98); padding: 50px; border-radius: 40px; 
            text-align: center; color: #333; width: 85%; max-width: 450px; border: 2px solid #ccc;
        }
        #timer { font-family: 'Fira Code', monospace; font-size: 3rem; color: #333; margin: 20px 0; font-weight: bold; }

        /* Garden Dashboard */
        #dashboard {
            position: absolute; inset: 0; display: none;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover;
            filter: brightness(0.3); transition: 4s filter ease;
        }

        .node {
            position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff;
            background-color: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; font-weight: 600;
            cursor: pointer; transform: translate(-50%, -50%); z-index: 10;
            box-shadow: 0 0 15px rgba(255,255,255,0.2); transition: 0.4s;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.2); border-color: var(--gold); box-shadow: 0 0 30px var(--gold); }

        /* Sequence-Based Numbered Nodes */
        #node-1 { bottom: 10%; left: 20%; } #node-2 { bottom: 20%; left: 80%; }
        #node-3 { bottom: 30%; left: 30%; } #node-4 { bottom: 40%; left: 70%; }
        #node-5 { bottom: 50%; left: 20%; } #node-6 { bottom: 60%; left: 80%; }
        #node-7 { bottom: 70%; left: 30%; } #node-8 { bottom: 80%; left: 70%; }
        #node-9 { bottom: 90%; left: 50%; }

        #node-cake { position: absolute; top: 15%; left: 50%; font-size: 5rem; display: none; transform: translate(-50%, -50%); cursor: pointer; z-index: 100; animation: float 3s infinite; }
        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -60%) scale(1.1); } }

        /* Story Panel */
        #panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 650px; background: rgba(0,0,0,0.92); backdrop-filter: blur(35px);
            padding: 40px; border-radius: 30px; border: 1px solid var(--gold);
            text-align: center; display: none; z-index: 1000;
        }

        /* Mini YouTube Hub */
        #yt-wrapper { position: fixed; bottom: 20px; right: 20px; z-index: 2000; opacity: 0.9; display: none; background: #000; padding: 5px; border-radius: 12px; border: 1px solid var(--gold); }
    </style>
</head>
<body>

    <div id="yt-wrapper"><div id="player"></div></div>

    <div id="gateway">
        <div id="auth-card">
            <h2 style="font-family: 'Playfair Display'; margin: 0;">Neeharika's Archive</h2>
            <div id="timer">00:00:00</div>
            <p style="font-size: 0.8rem; color: #888;">The garden awakens at midnight.</p>
        </div>
    </div>

    <div id="dashboard">
        <div class="node" id="node-1" onclick="openStory(0)">1</div>
        <div class="node" id="node-2" onclick="openStory(1)">2</div>
        <div class="node" id="node-3" onclick="openStory(2)">3</div>
        <div class="node" id="node-4" onclick="openStory(3)">4</div>
        <div class="node" id="node-5" onclick="openStory(4)">5</div>
        <div class="node" id="node-6" onclick="openStory(5)">6</div>
        <div class="node" id="node-7" onclick="openStory(6)">7</div>
        <div class="node" id="node-8" onclick="openStory(7)">8</div>
        <div class="node" id="node-9" onclick="openStory(8)">9</div>
        <div id="node-cake" onclick="cakeBoom()">🎂</div>
    </div>

    <div id="panel" onclick="this.style.display='none'">
        <p id="panel-text" style="font-size: 1.25rem; line-height: 1.8; font-weight: 300;"></p>
        <p style="font-size: 0.8rem; color: var(--gold); margin-top: 20px;">[ Click anywhere to continue ]</p>
    </div>

    <script>
        let ytPlayer;
        const storySegments = [
            "In the golden haze of a September morning, I met someone remarkable: You. At first, it was nothing remarkable—just another conversation.",
            "She didn’t just speak—she listened. Not the polite kind, but the kind that notices tremors in voices.",
            "Her favorite season is spring: 'I love spring because it whispers possibilities.'",
            "Her joy is effortless. One of her favorite songs, Espresso Cherry Cherry Lady, played softly once.",
            "I remember a small moment: a stray paper caught in the wind. 'It’s dancing,' she said.",
            "She has become more than a memory—a season, a melody, a story unfolding.",
            "I carry her presence like sunlight, warming corners I didn’t know were cold.",
            "I couldn’t always talk as much as I wanted, but I feel so comfortable talking to you.",
            "Today, I want to say: may this year be as vibrant as you are. Happy Birthday! 🌸"
        ];

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '45', width: '220',
                videoId: 'Y_8VmzWOsgs', // Aa Chal Ke Tujhe
                playerVars: { 'autoplay': 0, 'controls': 1, 'loop': 1, 'playlist': 'Y_8VmzWOsgs' }
            });
        }

        let keyChain = "";
        window.addEventListener('keydown', (e) => {
            keyChain += e.key;
            if (keyChain.includes("123456")) { keyChain = ""; initiateGarden(); }
        });

        function updateTimer() {
            const diff = new Date('2026-02-21T00:00:00+05:30') - new Date();
            if (diff <= 0) { initiateGarden(); return; }
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            setTimeout(updateTimer, 1000);
        }

        function initiateGarden() {
            if(ytPlayer) ytPlayer.playVideo();
            document.getElementById('gateway').style.opacity = '0';
            document.getElementById('yt-wrapper').style.display = 'block';
            setTimeout(() => {
                document.getElementById('gateway').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('node-cake').style.display = 'block';
                document.getElementById('dashboard').style.filter = "brightness(1)";
            }, 1000);
        }

        function openStory(i) {
            document.getElementById('panel-text').innerText = storySegments[i];
            document.getElementById('panel').style.display = 'block';
        }

        function cakeBoom() {
            // Switches to Happy Birthday Link
            ytPlayer.loadVideoById('5u4xTa3LR2U');
            document.getElementById('panel-text').innerHTML = "<span style='color:var(--gold); font-size:2.2rem; font-family:Playfair Display;'>BOOM! HAPPY BIRTHDAY NEEHARIKA! 🌸</span>";
            document.getElementById('panel').style.display = 'block';
            
            // Confetti Engine
            var end = Date.now() + 15000;
            (function frame() {
                confetti({ particleCount: 15, spread: 85, origin: { x: Math.random(), y: Math.random() - 0.2 }, colors: ['#ffd700', '#ff4081'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
        updateTimer();
    </script>
</body>
</html>
