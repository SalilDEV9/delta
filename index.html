<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Hidden Leaf Garden</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --naruto-orange: #ff6700; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; color: #fff; }

        /* Phase 1: Login Portal */
        #login-portal {
            position: absolute; inset: 0; z-index: 200;
            background: #0a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-box {
            text-align: center; background: #1a1a1a; padding: 40px; border-radius: 20px;
            border: 2px solid var(--naruto-orange); box-shadow: 0 0 30px var(--naruto-orange);
        }
        input {
            padding: 12px; border-radius: 8px; border: none; width: 200px; 
            font-family: 'Fira Code', monospace; text-align: center; font-size: 1.1rem;
        }

        /* Phase 2: Gateway with Naruto */
        #gateway {
            position: absolute; inset: 0; display: none;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1542273917363-3b1817f50a2b?q=80&w=2000') center/cover;
            flex-direction: column; justify-content: center; align-items: center; z-index: 100; opacity: 1; transition: 1.2s;
        }
        #naruto-box {
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 30px; 
            text-align: center; color: #333; width: 85%; max-width: 450px; border: 5px solid var(--naruto-orange);
        }
        #timer { font-family: 'Fira Code', monospace; font-size: 2.5rem; color: var(--naruto-orange); margin: 15px 0; font-weight: bold; }
        .guide-img { width: 150px; animation: shinobi 3s infinite ease-in-out; }
        @keyframes shinobi { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* Phase 3: The Garden */
        #garden-canvas {
            position: absolute; inset: 0; display: none;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover;
            filter: brightness(0.4); transition: 3s filter ease;
        }
        .node {
            position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff;
            background-size: cover; background-position: center; cursor: pointer; transform: translate(-50%, -50%); 
            z-index: 10; box-shadow: 0 0 15px var(--naruto-orange); transition: 0.4s;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.2); border-color: var(--naruto-orange); }

        /* Garden Node Positions */
        #node-1 { bottom: 20%; left: 30%; background-image: url('https://i.imgur.com/8Qp7k7w.jpg'); }
        #node-2 { bottom: 35%; left: 70%; background-image: url('https://i.imgur.com/XF9vP2C.jpg'); }
        #node-3 { bottom: 50%; left: 25%; background-image: url('https://i.imgur.com/uR1k9L8.jpg'); }
        #node-4 { bottom: 65%; left: 75%; background-image: url('https://i.imgur.com/m9WzP8S.jpg'); }
        #node-5 { bottom: 15%; left: 50%; background-image: url('https://i.imgur.com/pYI8e6Y.jpg'); }
        #node-cake { position: absolute; top: 12%; left: 50%; font-size: 4rem; display: none; transform: translate(-50%, -50%); cursor: pointer; }

        /* Memory UI */
        #panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 500px; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 30px; border: 2px solid var(--naruto-orange);
            text-align: center; display: none; z-index: 300;
        }
        .petal { position: absolute; background: #ffb7b2; border-radius: 150% 0 150% 0; animation: fall linear infinite; pointer-events: none; opacity: 0.6; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="audio-bg" loop><source src="https://archive.org/download/aachalketujhe/Aa%20Chal%20Ke%20Tujhe.mp3" type="audio/mpeg"></audio>
    <audio id="audio-bday" loop><source src="https://archive.org/download/HappyBirthdayToYou_201708/Happy%20Birthday%20To%20You.mp3" type="audio/mpeg"></audio>

    <div id="login-portal">
        <div class="login-box">
            <h2 style="color: var(--naruto-orange);">Shinobi Access Required</h2>
            <input type="password" id="pass" placeholder="Enter Password" onkeyup="checkPass(this.value)">
            <p style="font-size: 0.8rem; margin-top: 10px;">Authorization code required for Sir Siddharth's Archive.</p>
        </div>
    </div>

    <div id="gateway">
        <div id="naruto-box">
            <img src="https://www.pngarts.com/files/3/Naruto-PNG-Transparent-Image.png" class="guide-img" alt="Naruto">
            <h2 style="font-family: 'Playfair Display';">Neeharika, are you ready?</h2>
            <div id="timer">00:00:00</div>
            <p>Believe it! The garden awaits the stroke of midnight.</p>
        </div>
    </div>

    <div id="garden-canvas">
        <div class="node" id="node-1" onclick="showMemory(1)"></div>
        <div class="node" id="node-2" onclick="showMemory(2)"></div>
        <div class="node" id="node-3" onclick="showMemory(3)"></div>
        <div class="node" id="node-4" onclick="showMemory(4)"></div>
        <div class="node" id="node-5" onclick="showMemory(5)"></div>
        <div id="node-cake" onclick="birthdayBoom()">🎂</div>
    </div>

    <div id="panel" onclick="this.style.display='none'">
        <p id="panel-text" style="font-size: 1.3rem; line-height: 1.8;"></p>
        <p style="font-size: 0.8rem; color: var(--naruto-orange); margin-top: 15px;">[ Click to continue ]</p>
    </div>

    <script>
        const memories = [
            "In the golden haze of a September morning, I met someone remarkable: You.",
            "You didn't just speak—you listened. You saw the silent battles.",
            "“Even chaos can have rhythm,” you said. You found beauty in the wind.",
            "You are like Spring—fragile, persistent, and waiting to bloom.",
            "Today, on your birthday, I want to say: may this year be as vibrant as you are."
        ];

        function checkPass(val) {
            if (val === "123456") {
                document.getElementById('login-portal').style.display = 'none';
                document.getElementById('gateway').style.display = 'flex';
                updateTimer();
            }
        }

        function updateTimer() {
            const bday = new Date('2026-02-21T00:00:00+05:30');
            const diff = bday - new Date();
            if (diff <= 0) {
                document.getElementById('timer').innerText = "00:00:00";
                igniteCelebration();
                return;
            }
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            setTimeout(updateTimer, 1000);
        }

        function igniteCelebration() {
            const g = document.getElementById('gateway');
            g.style.opacity = '0';
            setTimeout(() => {
                g.style.display = 'none';
                document.getElementById('garden-canvas').style.display = 'block';
                document.getElementById('audio-bg').play();
                document.getElementById('node-cake').style.display = 'block';
                document.getElementById('garden-canvas').style.filter = "brightness(0.9)";
                createPetals();
            }, 1000);
        }

        function showMemory(id) {
            const p = document.getElementById('panel');
            document.getElementById('panel-text').innerText = memories[id-1];
            p.style.display = 'block';
        }

        function birthdayBoom() {
            document.getElementById('audio-bg').pause();
            document.getElementById('audio-bday').play();
            const p = document.getElementById('panel');
            document.getElementById('panel-text').innerHTML = "<span style='color:var(--naruto-orange); font-size:2rem;'>HAPPY BIRTHDAY NEEHARIKA! 🌸</span>";
            p.style.display = 'block';
            var end = Date.now() + 15000;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff6700'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff6700'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function createPetals() {
            for(let i=0; i<40; i++) {
                let p = document.createElement('div');
                p.className = 'petal';
                p.style.left = Math.random()*100 + 'vw';
                p.style.width = (Math.random()*10+5)+'px';
                p.style.animationDuration = (Math.random()*5+5)+'s';
                document.body.appendChild(p);
            }
        }
    </script>
</body>
</html>
