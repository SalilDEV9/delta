<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Birthday Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        :root { --accent: #ff4081; --gold: #ffd700; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; color: #fff; }

        /* Gateway Screen */
        #gateway {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1558904541-efa843a96f0f?q=80&w=2000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; transition: 1.5s ease-in-out;
        }
        #auth-card {
            background: rgba(255, 255, 255, 0.98); padding: 50px; border-radius: 40px; 
            text-align: center; color: #333; width: 85%; max-width: 450px; border: 2px solid #ccc;
        }
        #timer { font-family: 'Fira Code', monospace; font-size: 3rem; color: #333; margin: 20px 0; font-weight: bold; }

        /* Story Garden Dashboard */
        #dashboard {
            position: absolute; inset: 0; display: none;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover;
            filter: brightness(0.3); transition: 4s filter ease;
        }

        .node {
            position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 2px solid #fff;
            background-size: cover; background-position: center; cursor: pointer; transform: translate(-50%, -50%); 
            z-index: 10; box-shadow: 0 0 20px rgba(255,255,255,0.3); transition: 0.4s;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.2); border-color: var(--gold); box-shadow: 0 0 40px var(--gold); }

        /* Story Mapping */
        #node-1 { bottom: 15%; left: 20%; background-image: url('https://images.unsplash.com/photo-1490750967868-88cb4aca8fbf?w=200'); }
        #node-2 { bottom: 30%; left: 80%; background-image: url('https://images.unsplash.com/photo-1474403078171-841808b8b8ba?w=200'); }
        #node-3 { bottom: 45%; left: 20%; background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=200'); }
        #node-4 { bottom: 60%; left: 80%; background-image: url('https://images.unsplash.com/photo-1533134486753-c833f0ed4866?w=200'); }
        #node-5 { bottom: 75%; left: 20%; background-image: url('https://images.unsplash.com/photo-1501854140801-50d01674aa3e?w=200'); }
        #node-6 { bottom: 85%; left: 80%; background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=200'); }
        
        #node-cake { position: absolute; top: 15%; left: 50%; font-size: 5rem; display: none; transform: translate(-50%, -50%); cursor: pointer; z-index: 100; animation: bounce 3s infinite; }
        @keyframes bounce { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -60%) scale(1.1); } }

        /* Memory Panel */
        #panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 650px; background: rgba(0,0,0,0.92); backdrop-filter: blur(35px);
            padding: 40px; border-radius: 30px; border: 1px solid var(--gold);
            text-align: center; display: none; z-index: 1000;
        }

        /* Minimal Player Hub */
        #player-hub {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 150px;
            display: none; border: 1px solid rgba(255,255,255,0.2); z-index: 2000;
        }
    </style>
</head>
<body>

    <div id="player-hub"><div id="yt-player"></div></div>

    <div id="gateway">
        <div id="auth-card">
            <h2 style="font-family: 'Playfair Display'; margin: 0;">Neeharika's Archive</h2>
            <div id="timer">00:00:00</div>
            <p style="font-size: 0.9rem; color: #888;">The garden awaits the strike of midnight.</p>
        </div>
    </div>

    <div id="dashboard">
        <div class="node" id="node-1" onclick="openStory(0)"></div>
        <div class="node" id="node-2" onclick="openStory(1)"></div>
        <div class="node" id="node-3" onclick="openStory(2)"></div>
        <div class="node" id="node-4" onclick="openStory(3)"></div>
        <div class="node" id="node-5" onclick="openStory(4)"></div>
        <div class="node" id="node-6" onclick="openStory(5)"></div>
        <div id="node-cake" onclick="triggerFinale()">🎂</div>
    </div>

    <div id="panel" onclick="this.style.display='none'">
        <p id="panel-text" style="font-size: 1.25rem; line-height: 2; font-weight: 300;"></p>
        <p style="font-size: 0.8rem; color: var(--gold); margin-top: 20px;">[ Click anywhere to continue ]</p>
    </div>

    <script>
        let player;
        const storyChapters = [
            "In the golden haze of a September morning, I met her—Neeharika. At first, it was nothing remarkable—just another online conversation while the world passed by. But I sensed something different. [cite: 2026-01-20]",
            "She didn’t just speak—she listened. Not the polite kind, but the kind that notices tremors in voices and the silent battles people carry. [cite: 2026-01-20]",
            "Her favorite season is spring: 'I love spring because it whispers possibilities.' It’s about life itself, fragile and persistent, waiting to bloom. [cite: 2026-01-20]",
            "Joy, observation, insight—they flow naturally from her. She once said, 'Even chaos can have rhythm.' I realized then she didn’t just see—she felt. [cite: 2026-01-20]",
            "She is more than a memory—she is a season, a melody, a story unfolding in real time. People like her don’t merely enter your life—they illuminate it. [cite: 2026-01-20]",
            "Even through all the ups and downs, I feel so secure talking to you. That’s rare, and it’s something I treasure deeply. [cite: 2026-01-20]"
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '40', width: '200',
                videoId: 'Y_8VmzWOsgs', // Aa Chal Ke Tujhe
                playerVars: { 'autoplay': 0, 'controls': 1, 'loop': 1, 'playlist': 'Y_8VmzWOsgs' }
            });
        }

        let inputLog = "";
        window.addEventListener('keydown', (e) => {
            inputLog += e.key;
            if (inputLog.includes("123456")) { inputLog = ""; ignite(); }
        });

        function updateTimer() {
            const bday = new Date('2026-02-21T00:00:00+05:30');
            const diff = bday - new Date();
            if (diff <= 0) { ignite(); return; }
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            setTimeout(updateTimer, 1000);
        }

        function ignite() {
            if(player) player.playVideo();
            document.getElementById('gateway').style.opacity = '0';
            document.getElementById('player-hub').style.display = 'block';
            setTimeout(() => {
                document.getElementById('gateway').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('node-cake').style.display = 'block';
                document.getElementById('dashboard').style.filter = "brightness(1)";
            }, 1000);
        }

        function openStory(i) {
            document.getElementById('panel-text').innerText = storyChapters[i];
            document.getElementById('panel').style.display = 'block';
        }

        function triggerFinale() {
            player.loadVideoById('5u4xTa3LR2U'); // Happy Birthday Song
            document.getElementById('panel-text').innerHTML = "<span style='color:var(--gold); font-size:2.2rem; font-family:Playfair Display;'>HAPPY BIRTHDAY NEEHARIKA! 🌸</span><br><br>May this year illuminate your world. [cite: 2026-01-20]";
            document.getElementById('panel').style.display = 'block';
            
            var duration = 15 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 7, spread: 70, origin: { x: Math.random(), y: Math.random() - 0.2 }, colors: ['#ffd700', '#ff4081'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
        updateTimer();
    </script>
</body>
</html>
