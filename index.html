<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Hidden Leaf Garden</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --naruto-orange: #ff6700; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; color: #fff; }

        /* Gateway Screen (Default State) */
        #gateway {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542273917363-3b1817f50a2b?q=80&w=2000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #naruto-box {
            background: rgba(255, 255, 255, 0.98); padding: 40px; border-radius: 40px; 
            text-align: center; color: #333; width: 85%; max-width: 480px; border: 6px solid var(--naruto-orange);
        }

        #timer { font-family: 'Fira Code', monospace; font-size: 3rem; color: var(--naruto-orange); margin: 20px 0; font-weight: bold; }
        .guide-img { width: 180px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); animation: ninjaFloat 3s infinite ease-in-out; }
        @keyframes ninjaFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* The Garden Dashboard */
        #garden-canvas {
            position: absolute; inset: 0; display: none;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover;
            filter: brightness(0.3); transition: 4s filter ease;
        }

        .node {
            position: absolute; width: 75px; height: 75px; border-radius: 50%; border: 3px solid #fff;
            background-size: cover; background-position: center; cursor: pointer; transform: translate(-50%, -50%); 
            z-index: 10; box-shadow: 0 0 20px var(--naruto-orange); transition: 0.5s;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 45px #fff; border-color: var(--naruto-orange); }

        /* 8 Garden Node Positions */
        #node-1 { bottom: 15%; left: 20%; background-image: url('https://i.imgur.com/8Qp7k7w.jpg'); }
        #node-2 { bottom: 30%; left: 80%; background-image: url('https://i.imgur.com/XF9vP2C.jpg'); }
        #node-3 { bottom: 45%; left: 15%; background-image: url('https://i.imgur.com/uR1k9L8.jpg'); }
        #node-4 { bottom: 60%; left: 85%; background-image: url('https://i.imgur.com/m9WzP8S.jpg'); }
        #node-5 { bottom: 75%; left: 25%; background-image: url('https://i.imgur.com/pYI8e6Y.jpg'); }
        #node-6 { bottom: 85%; left: 75%; background-image: url('https://i.imgur.com/jV7O5YV.jpg'); }
        #node-7 { bottom: 50%; left: 50%; background-image: url('https://i.imgur.com/3Z6K6qA.jpg'); }
        #node-8 { bottom: 25%; left: 50%; background-image: url('https://i.imgur.com/4qNfL6Z.jpg'); }
        
        #node-cake { position: absolute; top: 10%; left: 50%; font-size: 5rem; display: none; transform: translate(-50%, -50%); cursor: pointer; filter: drop-shadow(0 0 30px #ff4081); }

        /* Memory Modal */
        #panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 550px; background: rgba(0,0,0,0.9); backdrop-filter: blur(30px);
            padding: 40px; border-radius: 35px; border: 2px solid var(--naruto-orange);
            text-align: center; display: none; z-index: 1000;
        }

        .petal { position: absolute; background: #ffb7b2; border-radius: 150% 0 150% 0; animation: fall linear infinite; pointer-events: none; opacity: 0.7; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="audio-bg" preload="auto" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <audio id="audio-bday" preload="auto" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>

    <div id="gateway">
        <div id="naruto-box">
            <img src="https://www.pngarts.com/files/3/Naruto-PNG-Transparent-Image.png" class="guide-img" alt="Naruto">
            <h2 style="font-family: 'Playfair Display'; margin-top: 10px;">Ready, Neeharika?</h2>
            <div id="timer">00:00:00</div>
            <p style="color: #666;">The Hidden Leaf Garden awakens at midnight!</p>
        </div>
    </div>

    <div id="garden-canvas">
        <div class="node" id="node-1" onclick="showMemory(1)"></div>
        <div class="node" id="node-2" onclick="showMemory(2)"></div>
        <div class="node" id="node-3" onclick="showMemory(3)"></div>
        <div class="node" id="node-4" onclick="showMemory(4)"></div>
        <div class="node" id="node-5" onclick="showMemory(5)"></div>
        <div class="node" id="node-6" onclick="showMemory(6)"></div>
        <div class="node" id="node-7" onclick="showMemory(7)"></div>
        <div class="node" id="node-8" onclick="showMemory(8)"></div>
        <div id="node-cake" onclick="birthdayBoom()">🎂</div>
    </div>

    <div id="panel" onclick="this.style.display='none'">
        <p id="panel-text" style="font-size: 1.4rem; line-height: 2; font-weight: 300;"></p>
        <p style="font-size: 0.9rem; color: var(--naruto-orange); margin-top: 20px;">[ Click to continue ]</p>
    </div>

    <script>
        const memories = [
            "In the golden haze of a September morning, I met someone remarkable: You. [cite: 2026-01-20]",
            "You didn't just speak—you listened. You saw the silent battles. [cite: 2026-01-20]",
            "“Even chaos can have rhythm,” you said. You found beauty in the wind. [cite: 2026-01-20]",
            "You are like Spring—fragile, persistent, and waiting to bloom. [cite: 2026-01-20]",
            "People like you don't merely enter lives—they illuminate them. [cite: 2026-01-20]",
            "I carry your presence like sunlight, warming corners I didn’t know were cold. [cite: 2026-01-20]",
            "You are a story unfolding in real time. Believe it! [cite: 2026-01-20]",
            "Today, I want to say: may this year be as vibrant as you are. [cite: 2026-01-20]"
        ];

        // UNIVERSAL ADMIN OVERRIDE: Type 123456 anywhere
        let buffer = "";
        window.addEventListener('keydown', (e) => {
            buffer += e.key;
            if (buffer.includes("123456")) {
                buffer = "";
                igniteBoom("Admin_Override");
            }
            if (buffer.length > 10) buffer = buffer.substring(1);
        });

        function updateTimer() {
            const bday = new Date('2026-02-21T00:00:00+05:30');
            const diff = bday - new Date();
            if (diff <= 0) {
                document.getElementById('timer').innerText = "00:00:00";
                igniteBoom("Midnight_Trigger");
                return;
            }
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            setTimeout(updateTimer, 1000);
        }

        function igniteBoom(source) {
            const g = document.getElementById('gateway');
            g.style.opacity = '0';
            g.style.transform = 'scale(1.5)';
            setTimeout(() => {
                g.style.display = 'none';
                document.getElementById('garden-canvas').style.display = 'block';
                document.getElementById('audio-bg').play();
                document.getElementById('node-cake').style.display = 'block';
                document.getElementById('garden-canvas').style.filter = "brightness(0.9)";
                createPetals();
            }, 1000);
        }

        function showMemory(id) {
            const p = document.getElementById('panel');
            document.getElementById('panel-text').innerText = memories[id-1];
            p.style.display = 'block';
        }

        function birthdayBoom() {
            document.getElementById('audio-bg').pause();
            document.getElementById('audio-bday').play();
            const p = document.getElementById('panel');
            document.getElementById('panel-text').innerHTML = "<span style='color:var(--naruto-orange); font-size:2.2rem; font-family:Playfair Display;'>HAPPY BIRTHDAY NEEHARIKA! 🌸</span>";
            p.style.display = 'block';
            var end = Date.now() + 15000;
            (function frame() {
                confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0 }, colors: ['#ff6700', '#ffffff'] });
                confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1 }, colors: ['#ff6700', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function createPetals() {
            for(let i=0; i<50; i++) {
                let p = document.createElement('div');
                p.className = 'petal';
                p.style.left = Math.random()*100 + 'vw';
                p.style.width = (Math.random()*12+6)+'px';
                p.style.animationDuration = (Math.random()*6+5)+'s';
                document.body.appendChild(p);
            }
        }
        updateTimer();
    </script>
</body>
</html>
