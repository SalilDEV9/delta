<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Memory Constellation</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Lora', serif;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #f6e2b7, #a1c4fd);
            background-size: 400% 400%; animation: gradientFlow 15s ease infinite;
            overflow: hidden; color: #3e2723;
        }

        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Gateway Phase */
        #gateway {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #fdfbf7; z-index: 10; transition: opacity 1.5s ease;
        }
        h1 { font-family: 'Playfair Display', serif; color: #d81b60; font-size: 2.5rem; }
        .btn {
            padding: 15px 35px; margin-top: 20px; background: #ff8fb3; color: white;
            border: none; border-radius: 30px; cursor: pointer; font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(255, 143, 179, 0.4); transition: 0.3s;
        }
        .btn:hover { background: #ff4081; transform: translateY(-3px); }

        /* Graph Container */
        #network-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Memory Modal */
        #memory-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; max-width: 600px; max-height: 85vh; overflow-y: auto;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px);
            border-radius: 20px; padding: 30px; z-index: 5; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            text-align: center; opacity: 0; transition: opacity 0.5s ease;
        }
        #memory-modal img { width: 100%; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        #memory-modal p { font-size: 1.2rem; line-height: 1.8; }
        .close-btn {
            margin-top: 20px; padding: 10px 25px; background: #3e2723; color: white;
            border: none; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .close-btn:hover { background: #d81b60; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="espresso.mp3" type="audio/mpeg"> 
    </audio>

    <div id="gateway">
        <h1>Neeharika's Constellation</h1>
        <p>A mapped sequence of memories.</p>
        <button class="btn" onclick="initiateSystem()">Explore Nodes</button>
    </div>

    <div id="network-container"></div>

    <div id="memory-modal">
        <img id="modal-img" src="" alt="Memory Image">
        <p id="modal-text"></p>
        <button class="close-btn" onclick="closeModal()">Close Memory</button>
    </div>

    <script>
        // Story Data Object
        const storyData = {
            1: {
                title: "September",
                img: "https://images.unsplash.com/photo-1474403078171-841808b8b8ba?w=600&q=80",
                text: "In the golden haze of a September morning, I was traveling, wandering through streets I barely knew, when I met her—Neeharika. At first, it was nothing remarkable. Just another online conversation while the world passed by outside my window."
            },
            2: {
                title: "The Listener",
                img: "https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=600&q=80",
                text: "But even in those first two days, I sensed something different about her. She didn’t just speak—she listened. Not the polite nod-and-smile kind of listening, but the kind that notices tremors in voices, the hesitation behind smiles, the silent battles that people carry in their chests."
            },
            3: {
                title: "Rhythm of Chaos",
                img: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=600&q=80",
                text: "Her joy is effortless. Not loud or performative, but a quiet, radiant energy that slips past walls. I remember a small moment: a stray paper caught in the wind. 'It’s dancing,' she said. 'Even chaos can have rhythm.'"
            },
            4: {
                title: "Spring",
                img: "https://images.unsplash.com/photo-1490750967868-88cb4aca8fbf?w=600&q=80",
                text: "Her favorite season is spring, and it suits her perfectly. There’s a rhythm to her presence, a cadence that mirrors renewal itself. Joy, observation, insight—they flow naturally from her."
            },
            5: {
                title: "Happy Birthday",
                img: "https://images.unsplash.com/photo-1513297887119-d46091b24bfa?w=600&q=80",
                text: "<strong style='font-size:1.5rem; color:#d81b60;'>Happy Birthday, Neeharika. 🌸</strong><br><br>Because of personal reasons and circumstances, I couldn’t always talk as much as I wanted. But even through all the ups and downs, I feel so comfortable and secure talking to you. That’s rare—and it’s something I treasure deeply. May this year be as vibrant, joyful, and full of possibilities as you are. You don't just enter lives—you illuminate them."
            }
        };

        function initiateSystem() {
            document.getElementById('bg-music').play();
            const gateway = document.getElementById('gateway');
            gateway.style.opacity = '0';
            setTimeout(() => { gateway.style.display = 'none'; }, 1500);
            drawNetwork();
        }

        function drawNetwork() {
            const container = document.getElementById('network-container');
            
            // Define Nodes
            const nodes = new vis.DataSet([
                { id: 1, label: 'The Meeting', shape: 'dot', size: 25, color: '#ff8fb3' },
                { id: 2, label: 'The Listener', shape: 'dot', size: 25, color: '#a1c4fd' },
                { id: 3, label: 'Dancing Chaos', shape: 'dot', size: 25, color: '#f6e2b7' },
                { id: 4, label: 'Spring Cadence', shape: 'dot', size: 25, color: '#a8e6cf' },
                { id: 5, label: 'The Core', shape: 'star', size: 40, color: '#d81b60' }
            ]);

            // Connect Nodes in a path
            const edges = new vis.DataSet([
                { from: 1, to: 2, color: { color: '#ffffff', opacity: 0.7 }, width: 2 },
                { from: 2, to: 3, color: { color: '#ffffff', opacity: 0.7 }, width: 2 },
                { from: 3, to: 4, color: { color: '#ffffff', opacity: 0.7 }, width: 2 },
                { from: 4, to: 5, color: { color: '#ffffff', opacity: 0.7 }, width: 3 }
            ]);

            const data = { nodes: nodes, edges: edges };
            
            const options = {
                nodes: { font: { size: 16, color: '#3e2723', face: 'Lora', background: 'rgba(255,255,255,0.5)' }, borderWidth: 3 },
                physics: { stabilization: false, barnesHut: { gravitationalConstant: -3000, springLength: 150 } },
                interaction: { hover: true }
            };

            const network = new vis.Network(container, data, options);

            // Node Click Event
            network.on("selectNode", function (params) {
                const nodeId = params.nodes[0];
                openModal(nodeId);
            });
        }

        function openModal(id) {
            const modal = document.getElementById('memory-modal');
            document.getElementById('modal-img').src = storyData[id].img;
            document.getElementById('modal-text').innerHTML = storyData[id].text;
            
            modal.style.display = 'block';
            setTimeout(() => { modal.style.opacity = '1'; }, 50);
        }

        function closeModal() {
            const modal = document.getElementById('memory-modal');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 500);
        }
    </script>
</body>
</html>
