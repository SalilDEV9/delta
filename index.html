<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Birthday Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4081; --glass: rgba(255, 255, 255, 0.08); }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; color: #fff; }

        .bg-glow { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,64,129,0.12) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; z-index: -1; filter: blur(80px); animation: drift 20s infinite alternate; }
        @keyframes drift { from { transform: translate(-10%, -10%); } to { transform: translate(20%, 20%); } }

        #gateway {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1558904541-efa843a96f0f?q=80&w=2000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; transition: 1.5s ease;
        }
        #auth-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); padding: 50px; border-radius: 40px; 
            text-align: center; width: 85%; max-width: 450px; border: 1px solid rgba(255,255,255,0.15);
        }
        #timer { font-family: 'Fira Code', monospace; font-size: 3.5rem; color: #fff; margin: 20px 0; font-weight: bold; text-shadow: 0 0 30px var(--accent); }

        #start-btn { display: none; margin-top: 20px; padding: 15px 40px; background: var(--gold); color: #000; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); } 70% { box-shadow: 0 0 0 20px rgba(255,215,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); } }

        #dashboard { position: absolute; inset: 0; display: none; background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover; filter: brightness(0.2); transition: 4s filter ease; }

        .node {
            position: absolute; width: 65px; height: 65px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4);
            background: var(--glass); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center;
            cursor: pointer; transform: translate(-50%, -50%); z-index: 100; color: var(--gold); font-weight: 600;
        }

        #node-1 { bottom: 12%; left: 22%; } #node-2 { bottom: 22%; left: 78%; }
        #node-3 { bottom: 32%; left: 32%; } #node-4 { bottom: 42%; left: 68%; }
        #node-5 { bottom: 52%; left: 22%; } #node-6 { bottom: 62%; left: 78%; }
        #node-7 { bottom: 72%; left: 32%; } #node-8 { bottom: 82%; left: 68%; }
        #node-9 { bottom: 90%; left: 50%; }

        #node-cake { position: absolute; top: 18%; left: 50%; font-size: 6rem; display: none; transform: translate(-50%, -50%); cursor: pointer; z-index: 1000; animation: float 4s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-20px); } }

        #panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 750px; background: rgba(10, 10, 10, 0.96); backdrop-filter: blur(50px);
            padding: 40px; border-radius: 30px; border: 1px solid var(--gold); text-align: center; display: none; z-index: 2000;
        }
        #panel-text { font-size: 1.3rem; line-height: 1.8; color: #fff; font-weight: 300; white-space: pre-wrap; }

        #pdf-btn { display: none; margin-top: 25px; padding: 12px 30px; background: var(--gold); color: #000; border: none; border-radius: 25px; font-weight: 600; cursor: pointer; }

        /* FIX: Player wrapper is now physically present but invisible until called */
        #yt-wrapper { position: fixed; bottom: 20px; right: 20px; z-index: 5000; background: #000; padding: 5px; border-radius: 15px; border: 1px solid var(--gold); opacity: 0; pointer-events: none; transition: opacity 1.5s ease; }

        .shake { animation: shake 0.5s both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        .typing { border-right: 2px solid var(--gold); animation: blink 0.7s infinite; }
        @keyframes blink { 50% { border-color: transparent; } }
    </style>
</head>
<body id="main-body">
    <div class="bg-glow"></div>
    <div id="yt-wrapper"><div id="player"></div></div>

    <div id="gateway">
        <div id="auth-card">
            <h2 style="font-family: 'Playfair Display'; font-size: 2rem;">The Archive</h2>
            <div id="timer">00:00:00</div>
            <p id="sub-text" style="font-size: 0.8rem; opacity: 0.6;">Awaiting Midnight...</p>
            <button id="start-btn" onclick="initiateGarden()">Begin Journey</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="node" id="node-1" onclick="openStory(0)">I</div>
        <div class="node" id="node-2" onclick="openStory(1)">II</div>
        <div class="node" id="node-3" onclick="openStory(2)">III</div>
        <div class="node" id="node-4" onclick="openStory(3)">IV</div>
        <div class="node" id="node-5" onclick="openStory(4)">V</div>
        <div class="node" id="node-6" onclick="openStory(5)">VI</div>
        <div class="node" id="node-7" onclick="openStory(6)">VII</div>
        <div class="node" id="node-8" onclick="openStory(7)">VIII</div>
        <div class="node" id="node-9" onclick="openStory(8)">IX</div>
        <div id="node-cake" onclick="cakeBoom()">🎂</div>
    </div>

    <div id="panel">
        <p id="panel-text"></p>
        <button id="pdf-btn" onclick="downloadPDF()">Download Memory PDF</button>
        <p style="font-size: 0.8rem; color: var(--gold); margin-top: 25px; cursor: pointer;" onclick="closePanel()">[ Back ]</p>
    </div>

    <script>
        let ytPlayer;
        let isReady = false;

        function getYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const introId = getYTId("https://youtube.com/shorts/H8MmANdFWcc?si=1FgsLVJ-Hj2Fcg6D"); 
        const bdayId = getYTId("https://youtube.com/shorts/qcB6z6nsC5k?si=-r07yS15PL54UWXw");

        const story = [
            "In the golden haze of a September morning, I met her—Neeharika. At first, it was just another conversation while the world passed by.",
            "She didn’t just speak—she listened. The kind that notices tremors in voices and silent battles.",
            "Her favorite season is spring: 'I love spring because it whispers possibilities.'",
            "Her joy is effortless. One of her favorite songs, Espresso Cherry Cherry Lady, played softly once.",
            "I remember a small moment: a stray paper caught in the wind. 'It’s dancing,' she said. 'Even chaos can have rhythm.'",
            "She has become more than a memory. She is a season, a melody, a story unfolding.",
            "I carry her presence like sunlight, warming corners I didn’t know were cold.",
            "I couldn’t always talk as much as I wanted due to personal reasons, but I feel so secure talking to you.",
            "Today, on your birthday, I want to say: may this year be as vibrant as you are. Happy Birthday! 🌸"
        ];

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '90', width: '160', videoId: introId, 
                playerVars: { 'autoplay': 0, 'controls': 1 },
                events: { 'onReady': () => { isReady = true; } }
            });
        }

        window.addEventListener('keydown', (e) => { if (e.key === '6') initiateGarden(); });

        function updateTimer() {
            const bday = new Date('2026-02-21T00:00:00+05:30');
            const diff = bday - new Date();
            
            if (diff <= 0) {
                document.getElementById('timer').innerText = "00:00:00";
                document.getElementById('sub-text').innerText = "The bloom is ready.";
                document.getElementById('start-btn').style.display = 'inline-block';
                return;
            }
            
            document.getElementById('timer').innerText = new Date(diff).toISOString().substr(11, 8);
            setTimeout(updateTimer, 1000);
        }

        function initiateGarden() {
            if(isReady) ytPlayer.playVideo();
            document.getElementById('gateway').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('node-cake').style.display = 'block';
            
            // Fade in the player smoothly
            document.getElementById('yt-wrapper').style.opacity = '1';
            document.getElementById('yt-wrapper').style.pointerEvents = 'auto';
            document.getElementById('dashboard').style.filter = "brightness(1)";
        }

        function typeWriter(text, i, cb) {
            if (i < text.length) {
                document.getElementById("panel-text").innerHTML = text.substring(0, i+1) + '<span class="typing"></span>';
                setTimeout(() => typeWriter(text, i + 1, cb), 20);
            } else if (cb) cb();
        }

        function openStory(i) {
            document.getElementById('panel').style.display = 'block';
            document.getElementById('pdf-btn').style.display = 'none';
            typeWriter(story[i], 0);
        }

        function closePanel() { document.getElementById('panel').style.display = 'none'; }

        function cakeBoom() {
            document.getElementById('main-body').classList.add('shake');
            if(isReady) ytPlayer.loadVideoById(bdayId);
            document.getElementById('panel').style.display = 'block';
            const msg = "HAPPY BIRTHDAY NEEHARIKA! 🌸\n\nYou are the most beautiful melody I’ve ever found. May your year be as radiant as your spirit. This garden and every word here... they are all for you.";
            typeWriter(msg, 0, () => { document.getElementById('pdf-btn').style.display = 'inline-block'; });
            var end = Date.now() + 15000;
            (function frame() {
                confetti({ particleCount: 10, spread: 85, origin: { y: 0.6 }, colors: ['#ffd700', '#ff4081'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(22); doc.text("For Neeharika", 105, 30, { align: "center" });
            doc.setFontSize(12); let y = 50;
            story.forEach(s => {
                let lines = doc.splitTextToSize(s, 170); doc.text(lines, 20, y);
                y += (lines.length * 7) + 10;
            });
            doc.save("Story_for_Neeharika.pdf");
        }
        updateTimer();
    </script>
</body>
</html>
