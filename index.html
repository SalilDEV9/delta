<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Birthday Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4081; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; color: #fff; }

        #gateway {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1558904541-efa843a96f0f?q=80&w=2000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; transition: 1.5s ease;
        }
        #timer { font-family: 'Fira Code', monospace; font-size: 3rem; color: #fff; margin: 20px 0; font-weight: bold; text-shadow: 0 0 20px var(--accent); }

        #dashboard {
            position: absolute; inset: 0; display: none;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover;
            filter: brightness(0.3); transition: 4s filter ease;
        }

        .node {
            position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff;
            background-color: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; font-weight: 600;
            cursor: pointer; transform: translate(-50%, -50%); z-index: 10; transition: 0.4s;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.2); border-color: var(--gold); }

        /* Story Sequence Nodes */
        #node-1 { bottom: 10%; left: 20%; } #node-2 { bottom: 20%; left: 80%; }
        #node-3 { bottom: 30%; left: 30%; } #node-4 { bottom: 40%; left: 70%; }
        #node-5 { bottom: 50%; left: 20%; } #node-6 { bottom: 60%; left: 80%; }
        #node-7 { bottom: 70%; left: 30%; } #node-8 { bottom: 80%; left: 70%; }
        #node-9 { bottom: 90%; left: 50%; }

        #node-cake { position: absolute; top: 15%; left: 50%; font-size: 5rem; display: none; transform: translate(-50%, -50%); cursor: pointer; z-index: 100; animation: float 3s infinite; }
        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -60%) scale(1.1); } }

        #panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 650px; background: rgba(0,0,0,0.92); backdrop-filter: blur(35px);
            padding: 40px; border-radius: 30px; border: 1px solid var(--gold); text-align: center; display: none; z-index: 1000;
        }

        #pdf-btn {
            display: none; margin-top: 20px; padding: 12px 25px; background: var(--gold); color: #000;
            border: none; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }

        #yt-wrapper { 
            position: fixed; bottom: 20px; right: 20px; z-index: 2000; 
            background: #000; padding: 10px; border-radius: 15px; 
            border: 1px solid var(--gold); display: none;
        }
    </style>
</head>
<body>

    <div id="yt-wrapper"><div id="player"></div></div>

    <div id="gateway">
        <h2 style="font-family: 'Playfair Display';">Neeharika's Archive</h2>
        <div id="timer">00:00:00</div>
        <p style="font-size: 0.8rem; color: #ccc;">Awaiting the Midnight Bloom...</p>
    </div>

    <div id="dashboard">
        <div class="node" id="node-1" onclick="openStory(0)">1</div>
        <div class="node" id="node-2" onclick="openStory(1)">2</div>
        <div class="node" id="node-3" onclick="openStory(2)">3</div>
        <div class="node" id="node-4" onclick="openStory(3)">4</div>
        <div class="node" id="node-5" onclick="openStory(4)">5</div>
        <div class="node" id="node-6" onclick="openStory(5)">6</div>
        <div class="node" id="node-7" onclick="openStory(6)">7</div>
        <div class="node" id="node-8" onclick="openStory(7)">8</div>
        <div class="node" id="node-9" onclick="openStory(8)">9</div>
        <div id="node-cake" onclick="cakeBoom()">🎂</div>
    </div>

    <div id="panel">
        <p id="panel-text"></p>
        <button id="pdf-btn" onclick="downloadPDF()">Download Full Story (PDF)</button>
        <p style="font-size: 0.8rem; color: var(--gold); margin-top: 20px; cursor: pointer;" onclick="closePanel()">[ Close ]</p>
    </div>

    <script>
        let ytPlayer;
        function getYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const introId = getYTId("https://youtube.com/shorts/H8MmANdFWcc?si=Bo1Sf86gwRabGJfO"); 
        const bdayId = getYTId("https://youtube.com/shorts/qcB6z6nsC5k?si=21uip56aKwvV90tO");

        const storySegments = [
            "In the golden haze of a September morning, I was traveling, wandering through streets I barely knew, when I met her—Neeharika. At first, it was nothing remarkable. Just another online conversation while the world passed by. [cite: 2026-01-20]",
            "She didn’t just speak—she listened. The kind that notices tremors in voices, the hesitation behind smiles, the silent battles that people carry in their chests. [cite: 2026-01-20]",
            "Her favorite season is spring: 'I love spring because it whispers possibilities.' It’s about life itself, fragile and persistent, waiting to bloom. [cite: 2026-01-20]",
            "Her joy is effortless. One of her favorite songs, Espresso Cherry Cherry Lady, played softly once—playful and bright, just like her. [cite: 2026-01-20]",
            "I remember a small moment: a stray paper caught in the wind. 'It’s dancing,' she said. 'Even chaos can have rhythm.' I realized she didn’t just see—she felt. [cite: 2026-01-20]",
            "She has become more than a memory. She is a season, a melody, a story unfolding in real time. People like her illuminate it. [cite: 2026-01-20]",
            "I carry her presence like sunlight, warming corners I didn’t know were cold. [cite: 2026-01-20]",
            "I couldn’t always talk as much as I wanted due to personal reasons, but I feel so comfortable and secure talking to you. That’s rare. [cite: 2026-01-20]",
            "Today, on your birthday, I want to say: may this year be as vibrant, joyful, and full of possibilities as you are. 🌸 [cite: 2026-01-20]"
        ];

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', { height: '100', width: '180', videoId: introId, playerVars: { 'autoplay': 0, 'controls': 1, 'loop': 1, 'playlist': introId } });
        }

        let inputLog = "";
        window.addEventListener('keydown', (e) => {
            inputLog += e.key;
            if (inputLog.includes("123456")) { inputLog = ""; initiateGarden(); }
        });

        function updateTimer() {
            const diff = new Date('2026-02-21T00:00:00+05:30') - new Date();
            if (diff <= 0) { initiateGarden(); return; }
            document.getElementById('timer').innerText = new Date(diff).toISOString().substr(11, 8);
            setTimeout(updateTimer, 1000);
        }

        function initiateGarden() {
            if(ytPlayer) ytPlayer.playVideo();
            document.getElementById('gateway').style.opacity = '0';
            document.getElementById('yt-wrapper').style.display = 'block';
            setTimeout(() => { document.getElementById('gateway').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; document.getElementById('node-cake').style.display = 'block'; }, 1000);
        }

        function openStory(i) {
            document.getElementById('panel-text').innerText = storySegments[i];
            document.getElementById('pdf-btn').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
        }

        function closePanel() { document.getElementById('panel').style.display = 'none'; }

        function cakeBoom() {
            ytPlayer.loadVideoById(bdayId);
            document.getElementById('panel-text').innerHTML = "<span style='color:var(--gold); font-size:2.5rem; font-family:Playfair Display;'>BOOM! HAPPY BIRTHDAY NEEHARIKA! 🌸</span>";
            document.getElementById('pdf-btn').style.display = 'inline-block';
            document.getElementById('panel').style.display = 'block';
            var end = Date.now() + 15000;
            (function frame() {
                confetti({ particleCount: 15, spread: 85, origin: { x: Math.random(), y: Math.random() - 0.2 }, colors: ['#ffd700', '#ff4081'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("times", "italic"); doc.setFontSize(22);
            doc.text("For Neeharika", 105, 30, { align: "center" });
            doc.setFontSize(12); doc.setFont("helvetica", "normal");
            let y = 50;
            storySegments.forEach(s => {
                let lines = doc.splitTextToSize(s, 170); doc.text(lines, 20, y);
                y += (lines.length * 7) + 5;
            });
            doc.save("Neeharikas_Story.pdf");
        }
        updateTimer();
    </script>
</body>
</html>
