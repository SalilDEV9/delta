<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeharika's Birthday Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4081; --glass: rgba(255, 255, 255, 0.08); }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Poppins', sans-serif; overflow: hidden; background: #050505; color: #fff; }

        /* Animated Background Orbs */
        .bg-glow { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,64,129,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; z-index: -1; filter: blur(80px); animation: drift 20s infinite alternate; }
        @keyframes drift { from { transform: translate(-10%, -10%); } to { transform: translate(20%, 20%); } }

        /* Gateway Phase */
        #gateway {
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1558904541-efa843a96f0f?q=80&w=2000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; transition: 2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #auth-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); padding: 60px; border-radius: 50px; 
            text-align: center; width: 85%; max-width: 500px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        #timer { font-family: 'Fira Code', monospace; font-size: 3.5rem; color: #fff; margin: 25px 0; font-weight: bold; letter-spacing: -2px; text-shadow: 0 0 30px var(--accent); }

        /* Garden Dashboard */
        #dashboard {
            position: absolute; inset: 0; display: none;
            background: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?q=80&w=2000') center/cover;
            filter: brightness(0.2); transition: 5s filter ease;
        }

        .node {
            position: absolute; width: 65px; height: 65px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4);
            background: var(--glass); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; font-weight: 600;
            cursor: pointer; transform: translate(-50%, -50%); z-index: 10; transition: 0.5s;
            box-shadow: 0 0 20px rgba(255,255,255,0.1); color: var(--gold); font-size: 1.2rem;
        }
        .node:hover { transform: translate(-50%, -50%) scale(1.3); border-color: var(--gold); box-shadow: 0 0 40px var(--gold); background: rgba(255,215,0,0.1); }

        /* Story Sequence Nodes */
        #node-1 { bottom: 12%; left: 22%; } #node-2 { bottom: 22%; left: 78%; }
        #node-3 { bottom: 32%; left: 32%; } #node-4 { bottom: 42%; left: 68%; }
        #node-5 { bottom: 52%; left: 22%; } #node-6 { bottom: 62%; left: 78%; }
        #node-7 { bottom: 72%; left: 32%; } #node-8 { bottom: 82%; left: 68%; }
        #node-9 { bottom: 90%; left: 50%; }

        #node-cake { position: absolute; top: 18%; left: 50%; font-size: 6rem; display: none; transform: translate(-50%, -50%); cursor: pointer; z-index: 100; animation: float 4s infinite ease-in-out; filter: drop-shadow(0 0 30px var(--accent)); }
        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-20px); } }

        /* Story Panel */
        #panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 700px; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(40px);
            padding: 50px; border-radius: 40px; border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center; display: none; z-index: 1000; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }
        #panel-text { font-size: 1.4rem; line-height: 1.8; font-weight: 300; font-style: italic; color: #efefef; }

        #pdf-btn {
            display: none; margin-top: 30px; padding: 15px 35px; background: linear-gradient(45deg, var(--gold), #ffaa00); color: #000;
            border: none; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(255,215,0,0.2);
        }
        #pdf-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255,215,0,0.4); }

        /* Floating Mini Player Hub */
        #yt-wrapper { 
            position: fixed; bottom: 30px; right: 30px; z-index: 2000; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(15px); padding: 8px; border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.1); display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div id="yt-wrapper"><div id="player"></div></div>

    <div id="gateway">
        <div id="auth-card">
            <h2 style="font-family: 'Playfair Display'; font-size: 2.2rem; margin: 0; letter-spacing: 1px;">The Archive</h2>
            <div id="timer">00:00:00</div>
            <p style="font-size: 0.85rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 2px;">Awaiting the Midnight Bloom</p>
        </div>
    </div>

    <div id="dashboard">
        <div class="node" id="node-1" onclick="openStory(0)">I</div>
        <div class="node" id="node-2" onclick="openStory(1)">II</div>
        <div class="node" id="node-3" onclick="openStory(2)">III</div>
        <div class="node" id="node-4" onclick="openStory(3)">IV</div>
        <div class="node" id="node-5" onclick="openStory(4)">V</div>
        <div class="node" id="node-6" onclick="openStory(5)">VI</div>
        <div class="node" id="node-7" onclick="openStory(6)">VII</div>
        <div class="node" id="node-8" onclick="openStory(7)">VIII</div>
        <div class="node" id="node-9" onclick="openStory(8)">IX</div>
        <div id="node-cake" onclick="cakeBoom()">🎂</div>
    </div>

    <div id="panel">
        <p id="panel-text"></p>
        <button id="pdf-btn" onclick="downloadPDF()">Export Memory as PDF</button>
        <p style="font-size: 0.8rem; color: var(--gold); margin-top: 30px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;" onclick="closePanel()">[ Back to Garden ]</p>
    </div>

    <script>
        let ytPlayer;
        function getYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const introId = getYTId("https://youtube.com/shorts/H8MmANdFWcc?si=Bo1Sf86gwRabGJfO"); 
        const bdayId = getYTId("https://youtube.com/shorts/qcB6z6nsC5k?si=21uip56aKwvV90tO");

        const storySegments = [
            "In the golden haze of a September morning, I was traveling, wandering through streets I barely knew, when I met her—Neeharika. At first, it was nothing remarkable. Just another online conversation while the world passed by.",
            "She didn’t just speak—she listened. The kind that notices tremors in voices, the hesitation behind smiles, the silent battles that people carry in their chests.",
            "Her favorite season is spring: 'I love spring because it whispers possibilities.' It’s about life itself, fragile and persistent, waiting to bloom.",
            "Her joy is effortless. One of her favorite songs, Espresso Cherry Cherry Lady, played softly once—playful and bright, just like her.",
            "I remember a small moment: a stray paper caught in the wind. 'It’s dancing,' she said. 'Even chaos can have rhythm.' I realized she didn’t just see—she felt.",
            "She has become more than a memory. She is a season, a melody, a story unfolding in real time. People like her illuminate it.",
            "I carry her presence like sunlight, warming corners I didn’t know were cold.",
            "I couldn’t always talk as much as I wanted due to personal reasons, but I feel so comfortable and secure talking to you. That’s rare.",
            "Today, on your birthday, I want to say: may this year be as vibrant, joyful, and full of possibilities as you are. 🌸"
        ];

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', { height: '80', width: '160', videoId: introId, playerVars: { 'autoplay': 0, 'controls': 1, 'loop': 1, 'playlist': introId } });
        }

        window.addEventListener('keydown', (e) => { if (e.key === '1' || e.key === '6') initiateGarden(); }); 

        function updateTimer() {
            const diff = new Date('2026-02-21T00:00:00+05:30') - new Date();
            if (diff <= 0) { initiateGarden(); return; }
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            setTimeout(updateTimer, 1000);
        }

        function initiateGarden() {
            if(ytPlayer) ytPlayer.playVideo();
            document.getElementById('gateway').style.opacity = '0';
            document.getElementById('yt-wrapper').style.display = 'block';
            setTimeout(() => { document.getElementById('gateway').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; document.getElementById('node-cake').style.display = 'block'; document.getElementById('dashboard').style.filter = "brightness(1)"; }, 1500);
        }

        function openStory(i) {
            document.getElementById('panel-text').innerText = storySegments[i];
            document.getElementById('pdf-btn').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
        }

        function closePanel() { document.getElementById('panel').style.display = 'none'; }

        function cakeBoom() {
            ytPlayer.loadVideoById(bdayId);
            document.getElementById('panel-text').innerHTML = "<span style='color:var(--gold); font-size:2.5rem; font-family:Playfair Display; font-style:italic;'>Happy Birthday, Neeharika! 🌸</span>";
            document.getElementById('pdf-btn').style.display = 'inline-block';
            document.getElementById('panel').style.display = 'block';
            var end = Date.now() + 15000;
            (function frame() {
                confetti({ particleCount: 20, spread: 90, origin: { x: Math.random(), y: Math.random() - 0.2 }, colors: ['#ffd700', '#ff4081', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("times", "italic"); doc.setFontSize(26);
            doc.text("For Neeharika", 105, 40, { align: "center" });
            doc.setDrawColor(255, 215, 0); doc.line(40, 45, 170, 45);
            doc.setFontSize(13); doc.setFont("helvetica", "normal");
            let y = 65;
            storySegments.forEach(s => {
                let lines = doc.splitTextToSize(s, 160); doc.text(lines, 25, y);
                y += (lines.length * 8) + 8;
            });
            doc.save("A_Story_of_September.pdf");
        }
        updateTimer();
    </script>
</body>
</html>
